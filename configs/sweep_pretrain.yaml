program: src/biomedclip_pretrain.py
project: biomedclip-pretrain
entity: philipp-wiese
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  lora_layers:
    values: [1, 2, 4]
  lora_r:
    values: [4, 8, 16]
  lora_alpha:
    values: [8.0, 16.0, 32.0]
  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  batch_size:
    values: [4, 8, 16, 32]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - biomedclip-pretrain
  - --wandb_entity
  - philipp-wiese
  - --excel
  - data/metadata.xlsx
  - --reports
  - data/text/translated_reports.json
  - --english
  - --images
  - data/images
  - --masks
  - data/segmentations
  - --out_dir
  - results
  - --use_mask
  - --epochs
  - "30"
  - --seed
  - "42"
  - --sweep
  - ${args}
