program: src/scratch_img_downstream.py
project: scratch-img-downstream
entity: philipp-wiese
method: bayes
run_cap: 40
metric:
  name: val/loss
  goal: minimize

parameters:
  encoder:
    values: [resnet18, vit_tiny]
  lr_encoder:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  lr_mlp:
    distribution: log_uniform_values
    min: 1e-4
    max: 5e-3
  warmup_epochs:
    values: [5, 10]
  weight_decay:
    distribution: log_uniform_values
    min: 0.01
    max: 0.1
  dropout:
    values: [0.2, 0.3, 0.4, 0.5]
  hidden_dims:
    values:
      - [64]
      - [128]
      - [256]
      - [128, 64]
  meta_embed_dim:
    values: [8, 16, 32]
  batch_size:
    values: [16, 32, 64]
  loss:
    values: [wce, focal, cb_focal, balanced_softmax, ldam]
  class_weighting:
    values: [inverse, effective]
  focal_gamma:
    values: [1.0, 2.0, 3.0]
  cb_beta:
    values: [0.9, 0.99, 0.999]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --out_dir
  - results/scratch_img
  - --epochs
  - "100"
  - --patience
  - "20"
  - --seed
  - "42"
  - --wandb
  - --wandb_project
  - scratch-img-downstream
  - --wandb_entity
  - philipp-wiese
  - --sweep
  - ${args}
