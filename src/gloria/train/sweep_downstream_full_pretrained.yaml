program: src/gloria_downstream.py
project: gloria-downstream
entity: philipp-wiese
method: bayes
run_cap: 60
metric:
  name: val/loss
  goal: minimize

parameters:
  lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4
  dropout:
    values: [0.2, 0.3, 0.4, 0.5]
  weight_decay:
    values: [0.001, 0.01, 0.05, 0.1]
  hidden_dims:
    values:
      - [64]
      - [32]
      - [128]
      - [256]
      - [128, 64]
      - [256, 128]
  batch_size:
    values: [16, 32, 64]
  loss:
    values: [focal, cb_focal]
  class_weighting:           # ignored by cb_focal (uses effective weighting internally via cb_beta)
    values: [sqrt, inverse, effective]
  focal_gamma:               # only active for focal and cb_focal
    distribution: uniform
    min: 2.5
    max: 3.5
  cb_beta:                   # only active for cb_focal
    values: [0.99, 0.999, 0.9999]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --checkpoint
  - results/gloria_pretrain/gloria_pretrain_unfreeze4_20260812_144239/best_retrieval_checkpoint.pt
  - --splits
  - data/internal_dataset/split_final.json
  - --binary
  - "false"
  - --out_dir
  - results
  - --use_mask
  - --head
  - mlp_no_meta
  - --epochs
  - "100"
  - --seed
  - "42"
  - --wandb
  - --wandb_project
  - gloria-downstream
  - --wandb_entity
  - philipp-wiese
  - --eval_test
  - --sweep
  - ${args}
