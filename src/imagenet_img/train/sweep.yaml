program: src/imagenet_img_downstream.py
project: imagenet-img-downstream
entity: philipp-wiese
method: bayes
run_cap: 40
metric:
  name: val/balanced_acc
  goal: maximize

parameters:
  head:
    value: mlp_no_meta
  lr_mlp:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-3
  weight_decay:
    distribution: log_uniform_values
    min: 0.01
    max: 0.1
  dropout:
    values: [0.2, 0.3, 0.4, 0.5]
  hidden_dims:
    values:
      - [64]
      - [128]
      - [256]
      - [128, 64]
  batch_size:
    values: [16, 32, 64]
  loss:
    values: [wce, focal]
  class_weighting:
    values: [sqrt, inverse, effective]
  focal_gamma:
    values: [1.0, 2.0, 3.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --out_dir
  - results/imagenet_img
  - --epochs
  - "100"
  - --patience
  - "20"
  - --seed
  - "42"
  - --wandb
  - --wandb_project
  - imagenet-img-downstream
  - --wandb_entity
  - philipp-wiese
  - --sweep
  - ${args}
