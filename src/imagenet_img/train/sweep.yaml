program: src/imagenet_img/train/downstream.py
project: imagenet-img-downstream
entity: philipp-wiese
method: bayes
run_cap: 40
metric:
  name: val/loss
  goal: minimize

parameters:
  head:
    value: mlp_no_meta
  lr_mlp:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  weight_decay:
    distribution: log_uniform_values
    min: 0.01
    max: 0.1
  dropout:
    values: [0.2, 0.3, 0.4, 0.5]
  hidden_dims:
    values:
      - [32]
      - [64]
      - [128]
      - [64, 32]
  batch_size:
    values: [32, 64, 128]
  loss:
    values: [focal, cb_focal]
  class_weighting:
    values: [sqrt, inverse, effective]
  focal_gamma:
    values: [1.5, 2.0, 2.5, 3.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --splits
  - data/internal_dataset/split_binary_final.json
  - --binary
  - "true"
  - --use_mask
  - --out_dir
  - results/imagenet_img
  - --epochs
  - "100"
  - --patience
  - "100"
  - --seed
  - "42"
  - --wandb
  - --wandb_project
  - imagenet-img-downstream
  - --wandb_entity
  - philipp-wiese
  - --sweep
  - --eval_test
  - ${args}
