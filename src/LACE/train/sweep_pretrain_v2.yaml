program: src/lace_pretrain_v2.py
project: lace-v2-pretrain
entity: philipp-wiese
method: bayes
run_cap: 50
metric:
  name: retrieval/mean_r1
  goal: maximize

# ─────────────────────────────────────────────────────────────────────────────
# Swept hyperparameters. Everything else that must match the reference config in
# sbatch/lace/run_lace_pretrain_v2.sh is pinned in the `command` block below.
# ─────────────────────────────────────────────────────────────────────────────
parameters:
  # ── Optimisation ─────────────────────────────────────────────────────────────
  lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 5e-4
  weight_decay:
    value: 0.001

  # ── Soft-target / t2i ───────────────────────────────────────────────────────
  tau_s_beur:
    value: 0.0325
  tau_s_bef:
    value: 0.038
  tau_s_img_full:
    value: 0.028

  lambda_ita:
    distribution: uniform
    min: 0.1
    max: 2.0
  lambda_sim:
    distribution: uniform
    min: 0.1
    max: 2.0
  lambda_ortho:
    distribution: uniform
    min: 0.1
    max: 2.0
  lambda_dice:
    distribution: uniform
    min: 0.1
    max: 2.0
  
  # ── t2i ──────────────────────────────────────────────────────────────────────
  t2i_mode:
    value: "image_image"
  lambda_t2i:
    value: 0.5
  same_image_boost:
    value: 10.0

  # ─── mask capacity ────────────────────────────────────────────────────────── 
  n_mask_heads:
    value: 16
  # ── Epoch stages ────────────────────────────────────────────────
  stage1_epochs:
    value: 20

command:
  - ${env}
  - ${interpreter}
  - ${program}
  # ── W&B ──────────────────────────────────────────────────────────────────────
  - --wandb
  - --wandb_project
  - lace-v2-pretrain
  - --wandb_entity
  - philipp-wiese
  # ── Encoder / data ───────────────────────────────────────────────────────────
  - --image_encoder
  - biomedclip
  - --splits
  - data/internal_dataset/split_binary_final.json
  - --no_btxrd
  - --context_fraction
  - "0.15"
  - --text_mode
  - mixed
  - --max_text_len
  - "128"
  - --max_beur_text_len
  - "256"
  - --max_bef_phrases
  - "16"
  - --max_beur_phrases
  - "16"
  - --batch_size
  - "128"
  - --btxrd_batch_size
  - "128"
  # ── Architecture ─────────────────────────────────────────────────────────────
  - --embed_dim
  - "512"
  - --lora_layers
  - "6"
  - --lora_r
  - "8"
  - --lora_alpha
  - "32"
  - --unfreeze_layers
  - "4"
  - --warm_start_projections
  # ── Mask token decoder ───────────────────────────────────────────────────────
  - --n_mask_tokens
  - "1"
  - --gauss_sigma
  - "4.5"
  - --mask_head_tau
  - "0.03"
  - --sim_attn_tau
  - "0.05"
  # ── Curriculum (authoritative loss/stage assignment) ─────────────────────────
  - --loss_stages
  - "dice:1,2"
  - "ortho:1,2"
  - "ita:2"
  - "sim:2"
  - --learn_loss_weights
  # ── Soft-target / t2i (non-swept) ────────────────────────────────────────────
  - --reweight_by_n_phrases
  # ── Optimisation (non-swept) ─────────────────────────────────────────────────
  - --scheduler
  - cosine
  - --epochs
  - "120"
  - --patience
  - "20"
  - --seed
  - "42"
  - ${args}
