program: src/lace_pretrain_v2.py
project: lace-v2-pretrain
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/loss
  goal: minimize

parameters:
  lora_layers:
    values: [2, 4, 6]
  lora_r:
    values: [4, 8, 16]
  lora_alpha:
    values: [8.0, 16.0, 32.0]
  embed_dim:
    values: [128, 256, 512]
  lr:
    distribution: log_uniform_values
    min: 5e-6
    max: 2e-4
  weight_decay:
    distribution: log_uniform_values
    min: 0.05
    max: 0.3
  n_mask_tokens:
    values: [8, 16, 32]
  tau_spatial:
    values: [0.05, 0.1, 0.2]
  lambda_seg:
    values: [0.5, 1.0, 2.0]
  lambda_sim:
    values: [0.5, 1.0, 2.0]
  batch_size:
    values: [16, 32]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - lace-v2-pretrain
  - --wandb_entity
  - philipp-wiese
  - --stage1_epochs
  - "10"
  - --stage2_epochs
  - "15"
  - --stage3_epochs
  - "15"
  - --patience
  - "20"
  - --seed
  - "42"
  - ${args}
