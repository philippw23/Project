program: src/lace_downstream.py
project: lace-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/best_f1_macro
  goal: maximize

parameters:
  head:
    value: mlp_no_meta
  downstream_visual_mode:
    values: [cls, fg, cls_fg]
  image_size:
    values: [224, 512]
  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  dropout:
    values: [0.0, 0.1, 0.2, 0.3]
  weight_decay:
    values: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5]
  hidden_dims:
    values:
      - [128, 64]
      - [128]
      - [256, 128]
      - [512, 256]
      - [256]
  batch_size:
    values: [16, 32, 64]
  loss:
    value: focal
  class_weighting:
    value: effective
  focal_gamma:
    distribution: uniform
    min: 2.5
    max: 3.25

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --version
  - v2
  - --checkpoint
  - results/lace_v2_pretrain/run_20260708_153804/best_retrieval_checkpoint.pt
  - --splits
  - data/internal_dataset/test/split_binary_backup.json
  - --binary
  - --use_mask
  - --out_dir
  - results
  - --epochs
  - "100"
  - --patience
  - "10"
  - --seed
  - "42"
  - --wandb
  - --wandb_project
  - lace-downstream
  - --wandb_entity
  - philipp-wiese
  - --sweep
  - ${args}
