program: src/lace_downstream.py
project: lace-downstream
entity: philipp-wiese
method: bayes
metric:
  name: val/loss
  goal: minimize
run_cap: 25

parameters:
  checkpoint:
    value: results/lace_v2_pretrain/run_20260721_080616/best_retrieval_checkpoint.pt

  downstream_visual_mode:
    values: [fg, cls_fg, cls]

  image_size:
    value: 224

  batch_size:
    values: [16, 32, 64]

  hidden_dims:
    values:
      - [64, 32]
      - [128, 64]
      - [256, 128]
      - [512, 256]

  dropout:
    values: [0.2, 0.25, 0.3, 0.35]

  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 3e-4

  weight_decay:
    values: [0.3, 0.35, 0.4, 0.45, 0.5]

  focal_gamma:
    distribution: uniform
    min: 2.5
    max: 3.25

  loss:
    value: focal

  class_weighting:
    value: effective

  head:
    value: mlp_no_meta

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --version
  - v2
  - --splits
  - data/internal_dataset/split_binary_final.json
  - --binary
  - --eval_test
  - --use_mask
  - --out_dir
  - results
  - --epochs
  - "100"
  - --patience
  - "10"
  - --seed
  - "42"
  - --wandb
  - --wandb_project
  - lace-downstream
  - --wandb_entity
  - philipp-wiese
  - --sweep
  - ${args}
