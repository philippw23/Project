program: src/lace_downstream.py
project: lace-downstream
entity: philipp-wiese
method: bayes
metric:
  name: val/f1_macro
  goal: maximize
run_cap: 60

parameters:
  checkpoint:
    value: results/lace_v2_pretrain/run_20260728_234136/best_retrieval_checkpoint.pt

  downstream_visual_mode:
    values: [cls, cls_fg, fg]

  image_size:
    value: 224

  batch_size:
    values: [16, 32, 64]

  hidden_dims:
    values:
      - [64, 32]
      - [128, 64]
      - [256, 128]
      - [512, 256]

  dropout:
    values: [0.20, 0.25, 0.30, 0.35]

  lr:
    distribution: log_uniform_values
    min: 8e-6
    max: 2.5e-4

  weight_decay:
    values: [0.30, 0.35, 0.40, 0.45, 0.50]

  focal_gamma:
    distribution: uniform
    min: 2.5
    max: 3.4
  cb_beta:                   # only active for cb_focal
    values: [0.99, 0.999, 0.9999]
  loss:
    values: [cb_focal, focal]

  class_weighting:
    values: [none, effective, sqrt, inverse]

  head:
    value: mlp_no_meta

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --version
  - v2
  - --splits
  - data/internal_dataset/split_binary_final.json
  - --binary
  - --eval_test
  - --use_mask
  - --out_dir
  - results
  - --epochs
  - "100"
  - --patience
  - "10"
  - --seed
  - "42"
  - --wandb
  - --wandb_project
  - lace-downstream
  - --wandb_entity
  - philipp-wiese
  - --sweep
  - ${args}
