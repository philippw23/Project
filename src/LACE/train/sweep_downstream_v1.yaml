program: src/lace_downstream.py
project: lace-downstream
entity: philipp-wiese
method: bayes
run_cap: 60
metric:
  name: val/loss
  goal: minimize

parameters:
  head:
    value: mlp_no_meta
  lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4
  dropout:
    values: [0.3, 0.4, 0.5]
  weight_decay:
    values: [0.01, 0.05, 0.1]
  hidden_dims:
    values:
      - [32]
      - [64]
      - [128]
      - [64, 32]
  batch_size:
    values: [16, 32, 64]
  loss:
    value: focal
  class_weighting:
    values: [effective, inverse]
  focal_gamma:
    distribution: uniform
    min: 2
    max: 3.5

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --version
  - v1
  - --checkpoint
  - results/lace_pretrain/run_20260525_171213/final_checkpoint.pt
  - --splits
  - data/internal_dataset/split.json
  - --out_dir
  - results
  - --epochs
  - "50"
  - --patience
  - "10"
  - --seed
  - "42"
  - --wandb
  - --wandb_project
  - lace-downstream
  - --wandb_entity
  - philipp-wiese
  - --sweep
  - ${args}
