program: src/lace_downstream.py
project: lace-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/loss
  goal: minimize

parameters:
  head:
    value: mlp_no_meta
  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  dropout:
    values: [0,1, 0.2, 0.3, 0.4]
  weight_decay:
    values: [0.05, 0.1, 0.15, 0.2]
  hidden_dims:
    values:
      - [128, 64]
      - [128]
      - [256, 128]
      - [512, 256]
      - [256]
  batch_size:
    values: [16, 32, 64]
  loss:
    value: focal
  class_weighting:
    value: effective
  focal_gamma:
    distribution: uniform
    min: 2.0
    max: 3.25
  use_mask:
    value: true

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --version
  - v1
  - --checkpoint
  - results/lace_pretrain/run_20260613_202920/best_retrieval_checkpoint.pt
  - --splits
  - data/internal_dataset/split.json
  - --out_dir
  - results
  - --epochs
  - "100"
  - --patience
  - "10"
  - --seed
  - "42"
  - --wandb
  - --wandb_project
  - lace-downstream
  - --wandb_entity
  - philipp-wiese
  - --sweep
  - ${args}
