program: src/lace_pretrain.py
project: lace-pretrain
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: retrieval/mean_r1
  goal: maximize

parameters:
  lr:
    distribution: log_uniform_values
    min: 5e-6
    max: 2e-4
  lora_r:
    values: [4, 8, 16]
  lora_layers:
    values: [2, 4, 6]
  weight_decay:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
  tau_s_beur:
    values: [0.02, 0.04, 0.07]
  tau_s_bef:
    values: [0.02, 0.04, 0.07]
  tau2:
    values: [0.03, 0.04, 0.07, 0.1]
  tau_s_img_full:
    values: [0.03, 0.04, 0.07]
  t2i_mode:
    values: [text_text, infonce]
  same_image_boost:
    values: [0.0, 10.0, 20.0]
  global_context_fraction:
    value: 0.15
  context_fraction:
    value: 0.15
  lambda_sim:
    value: 1.0
  lambda_ortho:
    value: 1.0
  lambda_ita:
    value: 1.0

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --splits
  - /mnt/nfs/homedirs/philippw/Project/data/internal_dataset/split.json
  - --btxrd_images
  - /mnt/nfs/homedirs/philippw/Project/data/BTXRD/images
  - --btxrd_annots
  - /mnt/nfs/homedirs/philippw/Project/data/BTXRD/Annotations
  - --out_dir
  - /mnt/nfs/homedirs/philippw/Project/results
  - --embed_dim
  - "512"
  - --batch_size
  - "128"
  - --btxrd_batch_size
  - "128"
  - --text_mode
  - phrase
  - --max_bef_phrases
  - "16"
  - --max_beur_phrases
  - "16"
  - --epochs
  - "100"
  - --patience
  - "25"
  - --warmup_epochs
  - "5"
  - --reweight_by_n_phrases
  - --learn_loss_weights
  - --warm_start_projections
  - --sim_lesion_only
  - --wandb
  - --wandb_project
  - lace-pretrain
  - --wandb_entity
  - philipp-wiese
  - --seed
  - "42"
  - ${args}
