program: src/lace_pretrain_v2.py
project: lace-v2-pretrain
entity: philipp-wiese
method: random
run_cap: 50

metric:
  name: retrieval/mean_r1
  goal: maximize

parameters:
  # ── Optimisation ─────────────────────────────────────────────────────────────
  lr:
    distribution: log_uniform_values
    min: 4e-5
    max: 1.5e-4

  weight_decay:
    distribution: log_uniform_values
    min: 3e-4
    max: 3e-3

  # Current best full-split run used 20. Search locally around that.
  stage1_epochs:
    values: [0, 16, 18, 20]

  # Current run improved until the last logged epoch, so give it more room.
  patience:
    value: 20

  # ── Soft-target temperatures ─────────────────────────────────────────────────
  tau_s_beur:
    values: [0.030, 0.0325, 0.035]

  tau_s_bef:
    values: [0.036, 0.038, 0.040]

  tau_s_img_full:
    values: [0.024, 0.028, 0.032]

  # ── t2i ──────────────────────────────────────────────────────────────────────
  t2i_mode:
    values: ["image_image", "infonce"]

  lambda_t2i:
    values: [0.25, 0.5, 0.75, 1.0]

  same_image_boost:
    values: [5.0, 10.0, 15.0]

  # ── mask capacity ────────────────────────────────────────────────
  n_mask_heads:
    values: [8, 16, 24]

  # Optional, but useful if you can afford the extra variation.
  lambda_mu:
    value: 0.01

command:
  - ${env}
  - ${interpreter}
  - ${program}

  # ── W&B ──────────────────────────────────────────────────────────────────────
  - --wandb
  - --wandb_project
  - lace-v2-pretrain
  - --wandb_entity
  - philipp-wiese

  # ── Encoder / data ───────────────────────────────────────────────────────────
  - --image_encoder
  - biomedclip
  - --splits
  - /mnt/nfs/homedirs/philippw/Project/data/internal_dataset/split_final.json
  - --btxrd_images
  - /mnt/nfs/homedirs/philippw/Project/data/BTXRD/images
  - --btxrd_annots
  - /mnt/nfs/homedirs/philippw/Project/data/BTXRD/Annotations
  - --out_dir
  - /mnt/nfs/homedirs/philippw/Project/results
  - --no_btxrd
  - --context_fraction
  - "0.15"
  - --text_mode
  - mixed
  - --max_text_len
  - "128"
  - --max_beur_text_len
  - "256"
  - --max_bef_phrases
  - "16"
  - --max_beur_phrases
  - "16"
  - --batch_size
  - "128"
  - --btxrd_batch_size
  - "128"

  # ── Architecture ─────────────────────────────────────────────────────────────
  - --embed_dim
  - "512"
  - --lora_layers
  - "6"
  - --lora_r
  - "8"
  - --lora_alpha
  - "32"
  - --unfreeze_layers
  - "4"
  - --warm_start_projections

  # ── Mask token decoder ───────────────────────────────────────────────────────
  - --n_mask_tokens
  - "1"
  - --gauss_sigma
  - "4.5"
  - --mask_head_tau
  - "0.03"
  - --sim_attn_tau
  - "0.05"

  # ── Evidence prototype space ─────────────────────────────────────────────────
  - --tau_proto
  - "0.1"

  # ── Curriculum / losses ──────────────────────────────────────────────────────
  - --loss_stages
  - "dice:1,2"
  - "ortho:1,2"
  - "ita:2"
  - "sim:2"
  - "rec:none"
  - "evid:none"
  - --learn_loss_weights
  - --lambda_sim
  - "1"
  - --lambda_ortho
  - "1"
  - --lambda_dice
  - "1"
  - --lambda_rec
  - "1"
  - --lambda_evid
  - "1"

  # ── Soft-target / t2i fixed flags ────────────────────────────────────────────
  - --reweight_by_n_phrases

  # ── Optimisation fixed args ──────────────────────────────────────────────────
  - --scheduler
  - cosine
  - --epochs
  - "160"
  - --seed
  - "42"

  # Swept parameters are appended here.
  - ${args}