program: src/biomedclip/train/img_text_downstream.py
project: biomedclip-img-text-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/balanced_acc
  goal: maximize

parameters:
  lr:
    distribution: log_uniform_values
    min: 3e-6
    max: 5e-5
  dropout:
    values: [0.1, 0.15, 0.2, 0.25]
  weight_decay:
    distribution: log_uniform_values
    min: 0.01
    max: 0.30
  hidden_dims:
    values:
      - [256, 128]
      - [512, 256]
  batch_size:
    values: [16, 32]
  loss:
    value: focal
  class_weighting:
    values: [inverse, effective] 
  focal_gamma:
    distribution: uniform
    min: 2.5
    max: 3.2

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - biomedclip-img-text-downstream
  - --wandb_entity
  - philipp-wiese
  - --splits
  - data/internal_dataset/split_final.json
  - --use_mask
  - --checkpoint
  - results/biomedclip_pretrain/run_bs128_unfreeze2_20260828_114112/best_r1_checkpoint.pt
  - --out_dir
  - results
  - --head
  - mlp_no_meta
  - --epochs
  - "200"
  - --patience
  - "15"
  - --seed
  - "42"
  - --sweep
  - --eval_test
  - ${args}
