program: src/biomedclip_img_text_downstream.py
project: biomedclip-img-text-downstream
entity: philipp-wiese
method: bayes
run_cap: 60
metric:
  name: val/loss
  goal: minimize

parameters:
  lr:
    distribution: log_uniform_values
    min: 3e-6
    max: 5e-4
  dropout:
    distribution: uniform
    min: 0.15
    max: 0.275
  weight_decay:
    distribution: log_uniform_values
    min: 0.01
    max: 0.30
  hidden_dims:
    values:
      - [128, 64]
      - [256, 128]
      - [512, 256]
  batch_size:
    values: [16, 32, 64]
  loss:
    values: [focal, cb_focal]
  class_weighting:
    values: [inverse, effective] 
  focal_gamma:
    distribution: uniform
    min: 2.7
    max: 3.2
  cb_beta:
    distribution: uniform
    min: 0.99
    max: 0.999

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - biomedclip-img-text-downstream
  - --wandb_entity
  - philipp-wiese
  - --splits
  - data/internal_dataset/split_final.json
  - --use_mask
  - --freezed_biomedclip
  - --out_dir
  - results
  - --head
  - mlp_no_meta
  - --epochs
  - "200"
  - --patience
  - "15"
  - --seed
  - "42"
  - --sweep
  - --eval_test
  - ${args}
