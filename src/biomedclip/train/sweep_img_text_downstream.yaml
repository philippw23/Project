program: src/biomedclip_img_text_downstream.py
project: biomedclip-img-text-downstream
entity: philipp-wiese
method: bayes
run_cap: 60
metric:
  name: val/loss
  goal: minimize

parameters:
  lr:
    distribution: log_uniform_values
    min: 3e-5
    max: 5e-4
  dropout:
    values: [0.2, 0.3, 0.4, 0.5]
  weight_decay:
    values: [0.01, 0.05, 0.1]
  hidden_dims:
    values:
      - [32]
      - [64]
      - [128]
      - [64, 32]
  batch_size:
    values: [16, 32, 64]
  loss:
    values: [focal, cb_focal]
  class_weighting:
    values: [inverse, effective] 
  focal_gamma:
    values: [2.0, 2.5, 3.0, 3.25]
  cb_beta:
    values: [0.99, 0.999]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - biomedclip-img-text-downstream
  - --wandb_entity
  - philipp-wiese
  - --splits
  - data/internal_dataset/split.json
  - --checkpoint
  - results/biomedclip_pretrain/run_bs128_unfreeze6_20260521_121550/final_checkpoint.pt
  - --out_dir
  - results
  - --head
  - mlp_no_meta
  - --epochs
  - "200"
  - --patience
  - "15"
  - --seed
  - "42"
  - --sweep
  - ${args}
