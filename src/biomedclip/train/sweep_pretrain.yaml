program: src/biomedclip_pretrain.py
project: biomedclip-pretrain
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: retrieval/mean_r1
  goal: maximize

parameters:
  lora_layers:
    values: [1, 2, 4]
  lora_r:
    values: [4, 8, 16]
  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  weight_decay:
    distribution: log_uniform_values
    min: 0.01
    max: 0.3
  batch_size:
    values: [16, 32, 64]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - biomedclip-pretrain
  - --wandb_entity
  - philipp-wiese
  - --excel
  - data/internal_dataset/metadata.xlsx
  - --reports
  - data/internal_dataset/text/translated_reports.json
  - --images
  - data/internal_dataset/images
  - --masks
  - data/internal_dataset/segmentations
  - --out_dir
  - results
  - --use_mask
  - --epochs
  - "55"
  - --seed
  - "42"
  - --sweep
  - ${args}
