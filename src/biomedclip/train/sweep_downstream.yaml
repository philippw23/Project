program: src/biomedclip_downstream.py
project: biomedclip-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/best_balanced_acc
  goal: maximize

parameters:
  batch_size:
    value: 64

  hidden_dims:
    values:
      - [128, 64]
      - [256, 128]
      - [512, 256]

  dropout:
    distribution: uniform
    min: 0.15
    max: 0.275

  lr:
    distribution: log_uniform_values
    min: 3e-6
    max: 5e-5

  weight_decay:
    distribution: log_uniform_values
    min: 0.01
    max: 0.30

  focal_gamma:
    distribution: uniform
    min: 2.7
    max: 3.2

  loss:
    values: ["focal"]

  class_weighting:
    values: ["none", "sqrt", "inverse"]

  head:
    value: mlp_no_meta

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - biomedclip-downstream
  - --wandb_entity
  - philipp-wiese
  - --splits
  - data/internal_dataset/split_final.json
  - --checkpoint
  - results/biomedclip_pretrain/run_bs128_unfreeze2_20260828_114112/best_r1_checkpoint.pt
  - --out_dir
  - results
  - --use_mask
  - --binary
  - "false"
  - --epochs
  - "100"
  - --seed
  - "42"
  - --sweep
  - ${args}
