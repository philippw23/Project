program: src/biomedclip_downstream.py
project: biomedclip-downstream
entity: philipp-wiese
method: bayes
run_cap: 60
metric:
  name: val/loss
  goal: minimize

parameters:
  head:
    value: mlp_no_meta
  lr:
    distribution: log_uniform_values
    min: 3e-5
    max: 5e-4
  dropout:
    values: [0.2, 0.3, 0.4, 0.5]
  weight_decay:
    values: [0.01, 0.05, 0.1]
  hidden_dims:
    values:
      - [32]
      - [64]
      - [128]
      - [64, 32]
  batch_size:
    values: [16, 32, 64]
  loss:
    values: [focal, cb_focal]
  class_weighting:           # ignored by cb_focal (uses effective weighting internally via cb_beta)
    values: [sqrt, inverse]
  focal_gamma:               # only active for focal and cb_focal
    values: [2.0, 3.0, 4.0]
  cb_beta:                   # only active for cb_focal
    values: [0.99, 0.999]
  binary:
    value: true
  

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - biomedclip-downstream
  - --wandb_entity
  - philipp-wiese
  - --splits
  - data/internal_dataset/split_binary.json
  - --freezed_biomedclip
  - --out_dir
  - results
  - --use_mask
  - --epochs
  - "50"
  - --seed
  - "42"
  - --sweep
  - ${args}
