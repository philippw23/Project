program: src/biomedclip_downstream.py
project: biomedclip-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/loss
  goal: minimize

parameters:
  head:
    value: mlp_no_meta
  lr:
    distribution: log_uniform_values
    min: 3e-5
    max: 5e-4
  dropout:
    values: [0.4, 0.5, 0.6]
  weight_decay:
    values: [0.01, 0.05, 0.1]
  loss:
    values: [wce, focal, cb_focal, balanced_softmax]
  focal_gamma:
    values: [1.0, 2.0, 3.0]
  cb_beta:
    values: [0.9, 0.99]
  hidden_dims:
    values:
      - [32]
      - [64]
      - [128]
      - [64, 32]
  batch_size:
    values: [16, 32, 64]
  finetune_lora_layers:
    values: [0, 2, 4]
  lr_encoder:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4
  finetune_lora_r:
    values: [4, 8, 16]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - biomedclip-downstream
  - --wandb_entity
  - philipp-wiese
  - --splits
  - results/biomedclip_pretrain/run_bs128_unfreeze4_20260516_125128/split.json
  - --checkpoint
  - results/biomedclip_pretrain/run_bs128_unfreeze4_20260516_125128/best_r1_checkpoint.pt
  - --out_dir
  - results
  - --use_mask
  - --epochs
  - "50"
  - --seed
  - "42"
  - --sweep
  - ${args}
