program: src/biomedclip_downstream.py
project: biomedclip-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/loss
  goal: minimize

parameters:
  head:
    values: [linear, mlp, mlp_no_meta]
  lr:
    distribution: log_uniform_values
    min: 3e-5
    max: 5e-4
  dropout:
    values: [0.3, 0.4, 0.5, 0.6]
  meta_embed_dim:
    values: [4, 8, 16, 32]
  weight_decay:
    values: [0.01, 0.05, 0.1]
  loss:
    values: [ce, wce, focal, cb_focal, balanced_softmax]
  focal_gamma:
    values: [1.0, 2.0, 3.0]
  cb_beta:
    values: [0.9, 0.99]
  hidden_dims:
    values:
      - [32]
      - [64]
      - [128]
      - [64, 32]
  batch_size:
    values: [16, 32, 64]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - biomedclip-downstream
  - --wandb_entity
  - philipp-wiese
  - --splits
  - results/biomedclip_pretrain/run_20260428_051525/splits.json
  - --checkpoint
  - results/biomedclip_pretrain/run_20260428_051525/best_val_checkpoint.pt
  - --excel
  - data/internal_dataset/metadata.xlsx
  - --out_dir
  - results
  - --use_mask
  - --epochs
  - "50"
  - --seed
  - "42"
  - --sweep
  - ${args}
