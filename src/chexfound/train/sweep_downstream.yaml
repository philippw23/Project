program: src/chexfound/train/downstream.py
project: chexfound-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/loss
  goal: minimize

parameters:
  loss:
    value: focal

  class_weighting:
    value: inverse

  batch_size:
    values: [32, 64]

  weight_decay:
    value: 0.1

  hidden_dims:
    values:
      - [64]
      - [64, 32]
      - [128, 64]

  dropout:
    values: [0.2, 0.3]

  lr:
    distribution: log_uniform_values
    min: 0.000025
    max: 0.00008

  focal_gamma:
    distribution: uniform
    min: 3.3
    max: 3.8

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - chexfound-downstream
  - --wandb_entity
  - philipp-wiese
  - --checkpoint
  - results/chexfound_pretrain_sweep/2gx5kqho/checkpoint_best.pth
  - --splits
  - data/internal_dataset/split_final.json
  - --binary
  - "false"
  - --out_dir
  - results
  - --use_mask
  - --head
  - mlp_no_meta
  - --epochs
  - "50"
  - --seed
  - "42"
  - --sweep
  - --eval_test
  - ${args}
