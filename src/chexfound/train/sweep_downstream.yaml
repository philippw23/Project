program: src/chexfound_downstream.py
project: chexfound-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/loss
  goal: minimize

parameters:
  lr:
    distribution: log_uniform_values
    min: 3e-5
    max: 5e-4
  dropout:
    values: [0.2, 0.3, 0.4, 0.5]
  weight_decay:
    values: [0.01, 0.05, 0.1]
  hidden_dims:
    values:
      - [32]
      - [64]
      - [128]
      - [64, 32]
  batch_size:
    values: [16, 32, 64]
  loss:
    values: [focal, cb_focal]
  class_weighting:
    values: [inverse, effective]
  focal_gamma:
    values: [2.0, 3.0, 3.25]
  cb_beta:
    values: [0.9, 0.99]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - chexfound-downstream
  - --wandb_entity
  - philipp-wiese
  - --checkpoint
  - results/chexfound_pretrain_sweep/1cjaztbq/checkpoint_best.pth
  - --splits
  - data/internal_dataset/split.json
  - --out_dir
  - results
  - --use_mask
  - --head
  - mlp_no_meta
  - --epochs
  - "50"
  - --seed
  - "42"
  - --sweep
  - ${args}
