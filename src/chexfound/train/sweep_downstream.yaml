program: src/chexfound_downstream.py
project: chexfound-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/loss
  goal: minimize

parameters:
  lr:
    distribution: log_uniform_values
    min: 3e-5
    max: 5e-4
  dropout:
    values: [0.2, 0.3, 0.4, 0.5]
  meta_embed_dim:
    values: [4, 8, 16, 32]
  weight_decay:
    values: [0.01, 0.05, 0.1]
  hidden_dims:
    values:
      - [128]
      - [256]
      - [256, 128]
      - [512, 256]
      - [256, 128, 64]
  batch_size:
    values: [16, 32, 64]
  loss:
    values: [ce, focal, cb_focal, balanced_softmax]
  class_weighting:
    values: [none, sqrt, inverse, effective]
  focal_gamma:
    values: [1.0, 2.0, 3.0]
  cb_beta:
    values: [0.9, 0.99]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - chexfound-downstream
  - --wandb_entity
  - philipp-wiese
  - --checkpoint
  - none
  - --chexfound_weights
  - src/chexfound/data/teacher_checkpoint.pth
  - --splits
  - results/biomedclip_pretrain/run_20260428_121303/splits.json
  - --excel
  - data/metadata.xlsx
  - --out_dir
  - results
  - --use_mask
  - --epochs
  - "30"
  - --seed
  - "42"
  - --sweep
  - ${args}
