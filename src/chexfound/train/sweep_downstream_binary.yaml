program: src/chexfound/train/downstream.py
project: chexfound-downstream
entity: philipp-wiese
method: bayes
run_cap: 30
metric:
  name: val/balanced_acc
  goal: maximize

parameters:
  loss:
    value: focal

  class_weighting:
    values: [inverse, sqrt]

  batch_size:
    value: 64

  weight_decay:
    values: [0.05, 0.1]

  hidden_dims:
    values:
      - [64]
      - [64, 32]
      - [128]
      - [128, 64]

  dropout:
    values: [0.2, 0.3, 0.4]

  lr:
    distribution: log_uniform_values
    min: 0.000025
    max: 0.0003

  focal_gamma:
    distribution: uniform
    min: 2.5
    max: 3.5

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --wandb
  - --wandb_project
  - chexfound-downstream
  - --wandb_entity
  - philipp-wiese
  - --checkpoint
  - results/chexfound_pretrain_sweep/2gx5kqho/checkpoint_best.pth
  - --splits
  - data/internal_dataset/split_binary_final.json
  - --binary
  - "true"
  - --btxrd_manifest
  - data/BTXRD/btxrd_downstream_binary.json
  - --out_dir
  - results
  - --use_mask
  - --head
  - mlp_no_meta
  - --epochs
  - "50"
  - --seed
  - "42"
  - --sweep
  - --eval_test
  - ${args}
